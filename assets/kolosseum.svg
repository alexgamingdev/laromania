<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#5c2a00"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a20"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1" fill="#c9a84c" opacity="0.7"/>
  <circle cx="80" cy="15" r="1.2" fill="#c9a84c" opacity="0.8"/>
  <circle cx="150" cy="25" r="1" fill="#c9a84c" opacity="0.6"/>
  <circle cx="280" cy="18" r="1.5" fill="#c9a84c" opacity="0.9"/>
  <circle cx="350" cy="10" r="1" fill="#c9a84c" opacity="0.7"/>
  <circle cx="370" cy="35" r="1.2" fill="#c9a84c" opacity="0.6"/>
  <!-- Ground -->
  <rect x="0" y="220" width="400" height="40" fill="url(#ground)"/>
  <!-- Colosseum outer wall - elliptical shape -->
  <!-- Bottom section -->
  <ellipse cx="200" cy="195" rx="170" ry="30" fill="#8b6030"/>
  <!-- Main body -->
  <rect x="30" y="80" width="340" height="140" rx="8" fill="url(#stone)"/>
  <!-- Elliptical cutout (interior) -->
  <ellipse cx="200" cy="165" rx="120" ry="20" fill="#5c3010"/>
  <!-- Arched arcades - Tier 1 (bottom) -->
  <g fill="#c9a050" opacity="0.3">
    <rect x="45" y="155" width="18" height="40"/>
    <rect x="78" y="155" width="18" height="40"/>
    <rect x="111" y="155" width="18" height="40"/>
    <rect x="144" y="155" width="18" height="40"/>
    <rect x="177" y="155" width="18" height="40"/>
    <rect x="210" y="155" width="18" height="40"/>
    <rect x="243" y="155" width="18" height="40"/>
    <rect x="276" y="155" width="18" height="40"/>
    <rect x="309" y="155" width="18" height="40"/>
    <rect x="337" y="155" width="18" height="40"/>
  </g>
  <!-- Arch openings tier 1 -->
  <g fill="#3a1a05">
    <path d="M45,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M78,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M111,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M144,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M177,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M210,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M243,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M276,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M309,195 h18 v-25 q-9-12-18-0 z"/>
    <path d="M337,195 h18 v-25 q-9-12-18-0 z"/>
  </g>
  <!-- Tier 2 -->
  <rect x="30" y="80" width="340" height="75" rx="4" fill="url(#stone)" opacity="0.9"/>
  <!-- Arch openings tier 2 -->
  <g fill="#3a1a05">
    <path d="M45,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M78,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M111,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M144,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M177,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M210,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M243,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M276,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M309,155 h18 v-28 q-9-13-18-0 z"/>
    <path d="M337,155 h18 v-28 q-9-13-18-0 z"/>
  </g>
  <!-- Tier 3 (top) -->
  <rect x="30" y="80" width="340" height="45" rx="4" fill="#c9a050" opacity="0.7"/>
  <!-- Pilasters tier 3 -->
  <g fill="#a07830" opacity="0.6">
    <rect x="40" y="80" width="6" height="45"/>
    <rect x="73" y="80" width="6" height="45"/>
    <rect x="106" y="80" width="6" height="45"/>
    <rect x="139" y="80" width="6" height="45"/>
    <rect x="172" y="80" width="6" height="45"/>
    <rect x="205" y="80" width="6" height="45"/>
    <rect x="238" y="80" width="6" height="45"/>
    <rect x="271" y="80" width="6" height="45"/>
    <rect x="304" y="80" width="6" height="45"/>
    <rect x="337" y="80" width="6" height="45"/>
    <rect x="364" y="80" width="6" height="45"/>
  </g>
  <!-- Attic (top strip) -->
  <rect x="30" y="75" width="340" height="10" rx="2" fill="#b08840"/>
  <!-- Cornice top -->
  <rect x="25" y="72" width="350" height="6" rx="2" fill="#c9a84c"/>
  <!-- Moon -->
  <circle cx="340" cy="40" r="18" fill="#f0d080"/>
  <circle cx="348" cy="36" r="14" fill="#5c2a00"/>
  <!-- Reflected light on ground -->
  <ellipse cx="200" cy="222" rx="120" ry="4" fill="#c9a84c" opacity="0.15"/>
  <!-- Label shadow -->
  <text x="200" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#c9a84c" opacity="0.9" font-weight="bold" letter-spacing="3">KOLOSSEUM</text>
</svg>
