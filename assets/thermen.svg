<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3060"/>
      <stop offset="100%" stop-color="#5080b0"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0b0"/>
      <stop offset="100%" stop-color="#c8a860"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2060a0"/>
      <stop offset="100%" stop-color="#104070"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4020"/>
      <stop offset="100%" stop-color="#4a2010"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a8060"/>
      <stop offset="100%" stop-color="#5a4020"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Clouds -->
  <ellipse cx="70" cy="40" rx="48" ry="18" fill="white" opacity="0.5"/>
  <ellipse cx="290" cy="30" rx="40" ry="15" fill="white" opacity="0.4"/>
  <!-- Steam from baths (atmosphere) -->
  <ellipse cx="160" cy="100" rx="25" ry="10" fill="white" opacity="0.2"/>
  <ellipse cx="240" cy="95" rx="22" ry="9" fill="white" opacity="0.18"/>
  <!-- Ground -->
  <rect x="0" y="225" width="400" height="35" fill="url(#ground)"/>
  <!-- Main Thermae building - large rectangular -->
  <rect x="30" y="80" width="340" height="150" rx="4" fill="url(#marble)"/>
  <!-- Roof with large barrel vault suggestion -->
  <path d="M25,80 Q200,40 375,80" fill="url(#roof)" stroke="none"/>
  <path d="M25,80 L375,80" stroke="#c9a84c" stroke-width="2" fill="none"/>
  <!-- Arched windows top level -->
  <g fill="#5080a0" opacity="0.7">
    <path d="M50,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M95,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M140,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M185,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M230,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M275,90 h30 v30 q-15-18-30-0 z"/>
    <path d="M320,90 h30 v30 q-15-18-30-0 z"/>
  </g>
  <!-- Pilasters between arches -->
  <g fill="#c9a84c" opacity="0.4">
    <rect x="47" y="85" width="6" height="65"/>
    <rect x="80" y="85" width="6" height="65"/>
    <rect x="92" y="85" width="6" height="65"/>
    <rect x="125" y="85" width="6" height="65"/>
    <rect x="137" y="85" width="6" height="65"/>
    <rect x="170" y="85" width="6" height="65"/>
    <rect x="182" y="85" width="6" height="65"/>
    <rect x="215" y="85" width="6" height="65"/>
    <rect x="227" y="85" width="6" height="65"/>
    <rect x="260" y="85" width="6" height="65"/>
    <rect x="272" y="85" width="6" height="65"/>
    <rect x="305" y="85" width="6" height="65"/>
    <rect x="317" y="85" width="6" height="65"/>
    <rect x="350" y="85" width="6" height="65"/>
  </g>
  <!-- Horizontal cornice mid -->
  <rect x="28" y="148" width="344" height="6" rx="1" fill="#c9a84c" opacity="0.7"/>
  <!-- Lower level - changing rooms / entrance -->
  <rect x="30" y="154" width="340" height="72" rx="2" fill="#d8c878"/>
  <!-- Entrance arch (center) -->
  <path d="M170,226 h60 v-45 q-30-35-60-0 z" fill="#8b6030"/>
  <!-- Entrance arch frame -->
  <path d="M170,200 Q200,175 230,200" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <!-- Doorway -->
  <rect x="185" y="200" width="30" height="26" rx="1" fill="#5a2a08"/>
  <!-- Lower arched doorways -->
  <g fill="#8b6030" opacity="0.8">
    <path d="M50,226 h35 v-30 q-17.5-20-35-0 z"/>
    <path d="M105,226 h35 v-30 q-17.5-20-35-0 z"/>
    <path d="M260,226 h35 v-30 q-17.5-20-35-0 z"/>
    <path d="M315,226 h35 v-30 q-17.5-20-35-0 z"/>
  </g>
  <!-- Pool / basin visible through arches -->
  <rect x="55" y="200" width="25" height="20" rx="1" fill="url(#water)" opacity="0.8"/>
  <rect x="110" y="200" width="25" height="20" rx="1" fill="url(#water)" opacity="0.8"/>
  <rect x="265" y="200" width="25" height="20" rx="1" fill="url(#water)" opacity="0.8"/>
  <rect x="320" y="200" width="25" height="20" rx="1" fill="url(#water)" opacity="0.8"/>
  <!-- Water shimmer -->
  <g stroke="white" stroke-width="1" opacity="0.3">
    <line x1="57" y1="207" x2="78" y2="207"/>
    <line x1="57" y1="213" x2="78" y2="213"/>
    <line x1="112" y1="207" x2="133" y2="207"/>
    <line x1="112" y1="213" x2="133" y2="213"/>
    <line x1="267" y1="207" x2="288" y2="207"/>
    <line x1="267" y1="213" x2="288" y2="213"/>
    <line x1="322" y1="207" x2="343" y2="207"/>
    <line x1="322" y1="213" x2="343" y2="213"/>
  </g>
  <!-- Central large pool (frigidarium) visible from outside -->
  <rect x="100" y="230" width="200" height="15" rx="3" fill="url(#water)"/>
  <g stroke="#80b0e0" stroke-width="1.5" opacity="0.4">
    <line x1="105" y1="236" x2="295" y2="236"/>
    <line x1="105" y1="242" x2="295" y2="242"/>
  </g>
  <!-- Steam wisps rising from pool -->
  <path d="M130,228 Q127,220 132,215" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M200,228 Q197,218 203,212" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M270,228 Q267,220 272,215" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Roman bathers (silhouettes) -->
  <circle cx="155" cy="220" r="7" fill="#3a2008" opacity="0.7"/>
  <rect x="149" y="226" width="12" height="4" rx="1" fill="#3a2008" opacity="0.7"/>
  <circle cx="250" cy="220" r="7" fill="#3a2008" opacity="0.7"/>
  <rect x="244" y="226" width="12" height="4" rx="1" fill="#3a2008" opacity="0.7"/>
  <!-- Decorative statues on top cornice -->
  <g fill="#d4b870" opacity="0.7">
    <rect x="90" y="73" width="5" height="12"/>
    <circle cx="92" cy="70" r="5"/>
    <rect x="195" y="68" width="5" height="12"/>
    <circle cx="197" cy="65" r="5"/>
    <rect x="300" y="72" width="5" height="12"/>
    <circle cx="302" cy="69" r="5"/>
  </g>
  <!-- Top cornice -->
  <rect x="20" y="77" width="360" height="6" rx="1" fill="#c9a84c" opacity="0.8"/>
  <!-- Label -->
  <text x="200" y="253" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c9a84c" font-weight="bold" letter-spacing="3">THERMEN</text>
</svg>
