<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a18"/>
      <stop offset="70%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#2a1a40"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b09060"/>
      <stop offset="100%" stop-color="#806030"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0a070"/>
      <stop offset="100%" stop-color="#907040"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a20"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>
  <!-- Night sky -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#c9a84c" opacity="0.8">
    <circle cx="20" cy="15" r="1.2"/>
    <circle cx="55" cy="8" r="1"/>
    <circle cx="90" cy="20" r="1.5"/>
    <circle cx="145" cy="5" r="1"/>
    <circle cx="220" cy="18" r="1.3"/>
    <circle cx="285" cy="7" r="1"/>
    <circle cx="340" cy="22" r="1.2"/>
    <circle cx="380" cy="10" r="1"/>
    <circle cx="70" cy="40" r="0.8"/>
    <circle cx="170" cy="35" r="1"/>
    <circle cx="320" cy="35" r="0.9"/>
  </g>
  <!-- Moon -->
  <circle cx="350" cy="38" r="20" fill="#f0d880" opacity="0.9"/>
  <!-- Insula building (tall multi-story) CENTER -->
  <rect x="120" y="25" width="160" height="195" rx="3" fill="url(#wall2)"/>
  <!-- Floors division lines -->
  <g stroke="#7a5a28" stroke-width="1.5" opacity="0.5">
    <line x1="120" y1="70" x2="280" y2="70"/>
    <line x1="120" y1="105" x2="280" y2="105"/>
    <line x1="120" y1="140" x2="280" y2="140"/>
    <line x1="120" y1="175" x2="280" y2="175"/>
  </g>
  <!-- Windows floor 5 (top) -->
  <g fill="#2a1a05">
    <rect x="135" y="35" width="18" height="22" rx="1"/>
    <rect x="165" y="35" width="18" height="22" rx="1"/>
    <rect x="195" y="35" width="18" height="22" rx="1"/>
    <rect x="225" y="35" width="18" height="22" rx="1"/>
    <rect x="245" y="35" width="18" height="22" rx="1"/>
  </g>
  <!-- Lit window floor 5 -->
  <rect x="195" y="35" width="18" height="22" rx="1" fill="#f0c040" opacity="0.7"/>
  <!-- Windows floor 4 -->
  <g fill="#2a1a05">
    <rect x="135" y="76" width="18" height="22" rx="1"/>
    <rect x="165" y="76" width="18" height="22" rx="1"/>
    <rect x="195" y="76" width="18" height="22" rx="1"/>
    <rect x="225" y="76" width="18" height="22" rx="1"/>
    <rect x="245" y="76" width="18" height="22" rx="1"/>
  </g>
  <!-- Lit windows floor 4 -->
  <rect x="135" y="76" width="18" height="22" rx="1" fill="#f0c040" opacity="0.6"/>
  <rect x="245" y="76" width="18" height="22" rx="1" fill="#f0c040" opacity="0.5"/>
  <!-- Windows floor 3 -->
  <g fill="#2a1a05">
    <rect x="135" y="111" width="18" height="22" rx="1"/>
    <rect x="165" y="111" width="18" height="22" rx="1"/>
    <rect x="195" y="111" width="18" height="22" rx="1"/>
    <rect x="225" y="111" width="18" height="22" rx="1"/>
    <rect x="245" y="111" width="18" height="22" rx="1"/>
  </g>
  <!-- Lit windows floor 3 -->
  <rect x="165" y="111" width="18" height="22" rx="1" fill="#f0c040" opacity="0.7"/>
  <rect x="225" y="111" width="18" height="22" rx="1" fill="#f0c040" opacity="0.6"/>
  <!-- Windows floor 2 -->
  <g fill="#2a1a05">
    <rect x="135" y="146" width="18" height="22" rx="1"/>
    <rect x="165" y="146" width="18" height="22" rx="1"/>
    <rect x="195" y="146" width="18" height="22" rx="1"/>
    <rect x="225" y="146" width="18" height="22" rx="1"/>
    <rect x="245" y="146" width="18" height="22" rx="1"/>
  </g>
  <!-- Lit windows floor 2 -->
  <rect x="135" y="146" width="18" height="22" rx="1" fill="#f0c040" opacity="0.5"/>
  <rect x="195" y="146" width="18" height="22" rx="1" fill="#f0c040" opacity="0.7"/>
  <rect x="245" y="146" width="18" height="22" rx="1" fill="#f0c040" opacity="0.6"/>
  <!-- Floor 1 (ground floor) - shops -->
  <g fill="#3a2008">
    <rect x="125" y="180" width="30" height="35" rx="1"/>
    <rect x="162" y="180" width="28" height="35" rx="1"/>
    <rect x="211" y="180" width="28" height="35" rx="1"/>
    <rect x="245" y="180" width="30" height="35" rx="1"/>
  </g>
  <!-- Shop arches -->
  <g fill="#2a1a05">
    <path d="M125,215 h30 v-20 q-15-14-30-0 z"/>
    <path d="M162,215 h28 v-20 q-14-14-28-0 z"/>
    <path d="M211,215 h28 v-20 q-14-14-28-0 z"/>
    <path d="M245,215 h30 v-20 q-15-14-30-0 z"/>
  </g>
  <!-- Door center ground floor -->
  <rect x="188" y="185" width="24" height="35" rx="1" fill="#5a2a08"/>
  <!-- Lamp over door -->
  <circle cx="200" cy="182" r="4" fill="#f0d060" opacity="0.8"/>
  <circle cx="200" cy="182" r="8" fill="#f0d060" opacity="0.2"/>
  <!-- Adjacent buildings (shorter) -->
  <rect x="0" y="80" width="120" height="140" rx="2" fill="url(#wall1)"/>
  <rect x="280" y="90" width="120" height="130" rx="2" fill="url(#wall1)"/>
  <!-- Windows adjacent left -->
  <g fill="#2a1a05">
    <rect x="15" y="90" width="16" height="18" rx="1"/>
    <rect x="45" y="90" width="16" height="18" rx="1"/>
    <rect x="75" y="90" width="16" height="18" rx="1"/>
    <rect x="15" y="120" width="16" height="18" rx="1"/>
    <rect x="45" y="120" width="16" height="18" rx="1"/>
    <rect x="75" y="120" width="16" height="18" rx="1"/>
    <rect x="15" y="150" width="16" height="18" rx="1"/>
    <rect x="75" y="150" width="16" height="18" rx="1"/>
  </g>
  <rect x="45" y="150" width="16" height="18" rx="1" fill="#f0c040" opacity="0.6"/>
  <!-- Windows adjacent right -->
  <g fill="#2a1a05">
    <rect x="292" y="100" width="16" height="18" rx="1"/>
    <rect x="322" y="100" width="16" height="18" rx="1"/>
    <rect x="360" y="100" width="16" height="18" rx="1"/>
    <rect x="292" y="130" width="16" height="18" rx="1"/>
    <rect x="322" y="130" width="16" height="18" rx="1"/>
    <rect x="360" y="130" width="16" height="18" rx="1"/>
    <rect x="292" y="160" width="16" height="18" rx="1"/>
    <rect x="360" y="160" width="16" height="18" rx="1"/>
  </g>
  <rect x="322" y="160" width="16" height="18" rx="1" fill="#f0c040" opacity="0.5"/>
  <!-- Street -->
  <rect x="0" y="220" width="400" height="40" fill="url(#street)"/>
  <!-- Cobblestone pattern -->
  <g stroke="#5a3a15" stroke-width="1" opacity="0.4">
    <line x1="0" y1="228" x2="400" y2="228"/>
    <line x1="0" y1="236" x2="400" y2="236"/>
    <line x1="0" y1="244" x2="400" y2="244"/>
    <line x1="30" y1="220" x2="30" y2="260"/>
    <line x1="60" y1="220" x2="60" y2="260"/>
    <line x1="90" y1="220" x2="90" y2="260"/>
    <line x1="120" y1="220" x2="120" y2="260"/>
    <line x1="150" y1="220" x2="150" y2="260"/>
    <line x1="180" y1="220" x2="180" y2="260"/>
    <line x1="210" y1="220" x2="210" y2="260"/>
    <line x1="240" y1="220" x2="240" y2="260"/>
    <line x1="270" y1="220" x2="270" y2="260"/>
    <line x1="300" y1="220" x2="300" y2="260"/>
    <line x1="330" y1="220" x2="330" y2="260"/>
    <line x1="360" y1="220" x2="360" y2="260"/>
  </g>
  <!-- Torch on wall -->
  <rect x="115" y="205" width="4" height="18" fill="#8b5a20"/>
  <circle cx="117" cy="203" r="5" fill="#f08020" opacity="0.9"/>
  <circle cx="117" cy="203" r="9" fill="#f08020" opacity="0.3"/>
  <!-- Label -->
  <text x="200" y="255" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c9a84c" font-weight="bold" letter-spacing="3">INSULA</text>
</svg>
