<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6080"/>
      <stop offset="100%" stop-color="#8ab0d0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d898"/>
      <stop offset="100%" stop-color="#c0a058"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7040"/>
      <stop offset="100%" stop-color="#5a4020"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a04020"/>
      <stop offset="100%" stop-color="#6a2010"/>
    </linearGradient>
  </defs>
  <!-- Sky (daytime) -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Clouds -->
  <ellipse cx="80" cy="35" rx="50" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="60" cy="35" rx="35" ry="15" fill="white" opacity="0.6"/>
  <ellipse cx="320" cy="50" rx="45" ry="18" fill="white" opacity="0.6"/>
  <ellipse cx="340" cy="50" rx="30" ry="14" fill="white" opacity="0.5"/>
  <!-- Sun -->
  <circle cx="340" cy="30" r="22" fill="#f8e040" opacity="0.9"/>
  <!-- Ground -->
  <rect x="0" y="215" width="400" height="45" fill="url(#ground)"/>
  <!-- Cobblestone path -->
  <g stroke="#7a5a30" stroke-width="1" opacity="0.5">
    <line x1="170" y1="215" x2="170" y2="260"/>
    <line x1="200" y1="215" x2="200" y2="260"/>
    <line x1="230" y1="215" x2="230" y2="260"/>
    <line x1="155" y1="230" x2="245" y2="230"/>
    <line x1="155" y1="245" x2="245" y2="245"/>
  </g>
  <!-- Main school building -->
  <rect x="80" y="100" width="240" height="120" rx="3" fill="url(#wall)"/>
  <!-- Roof -->
  <polygon points="70,100 330,100 310,70 90,70" fill="url(#roof)"/>
  <!-- Roof tiles -->
  <g stroke="#8b3010" stroke-width="1.5" opacity="0.4">
    <line x1="95" y1="70" x2="90" y2="100"/>
    <line x1="115" y1="70" x2="110" y2="100"/>
    <line x1="135" y1="70" x2="130" y2="100"/>
    <line x1="155" y1="70" x2="150" y2="100"/>
    <line x1="175" y1="70" x2="170" y2="100"/>
    <line x1="195" y1="70" x2="190" y2="100"/>
    <line x1="215" y1="70" x2="210" y2="100"/>
    <line x1="235" y1="70" x2="230" y2="100"/>
    <line x1="255" y1="70" x2="250" y2="100"/>
    <line x1="275" y1="70" x2="270" y2="100"/>
    <line x1="295" y1="70" x2="290" y2="100"/>
  </g>
  <!-- Frieze / cornice -->
  <rect x="75" y="97" width="250" height="8" rx="1" fill="#c9a84c" opacity="0.7"/>
  <!-- Columns -->
  <g fill="#d8c888">
    <rect x="90" y="105" width="12" height="95"/>
    <rect x="115" y="105" width="12" height="95"/>
    <rect x="140" y="105" width="12" height="95"/>
    <rect x="248" y="105" width="12" height="95"/>
    <rect x="273" y="105" width="12" height="95"/>
    <rect x="298" y="105" width="12" height="95"/>
  </g>
  <!-- Column bases -->
  <g fill="#b09050" opacity="0.8">
    <rect x="87" y="200" width="18" height="5"/>
    <rect x="112" y="200" width="18" height="5"/>
    <rect x="137" y="200" width="18" height="5"/>
    <rect x="245" y="200" width="18" height="5"/>
    <rect x="270" y="200" width="18" height="5"/>
    <rect x="295" y="200" width="18" height="5"/>
  </g>
  <!-- Inscription above door -->
  <rect x="160" y="108" width="80" height="18" rx="1" fill="#d4b870" opacity="0.5"/>
  <text x="200" y="121" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#5a2a00" font-style="italic">LVDVS LITTERARIVS</text>
  <!-- Door -->
  <rect x="178" y="145" width="44" height="75" rx="2" fill="#5a2a08"/>
  <path d="M178,168 h44" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <!-- Door arch decoration -->
  <path d="M178,158 Q200,140 222,158" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <!-- Windows -->
  <g fill="#6a8aaa" opacity="0.7">
    <rect x="100" y="130" width="28" height="38" rx="2"/>
    <rect x="152" y="130" width="28" height="38" rx="2"/>
    <rect x="220" y="130" width="28" height="38" rx="2"/>
    <rect x="272" y="130" width="28" height="38" rx="2"/>
  </g>
  <!-- Window shutters -->
  <g fill="#5a3010" opacity="0.6">
    <rect x="100" y="130" width="12" height="38" rx="1"/>
    <rect x="152" y="130" width="12" height="38" rx="1"/>
    <rect x="232" y="130" width="16" height="38" rx="1"/>
    <rect x="284" y="130" width="16" height="38" rx="1"/>
  </g>
  <!-- Students sitting outside (silhouettes) -->
  <!-- Student 1 sitting -->
  <circle cx="50" cy="200" r="8" fill="#3a2008"/>
  <rect x="42" y="207" width="16" height="10" rx="2" fill="#3a2008"/>
  <!-- Scroll/tablet -->
  <rect x="55" y="204" width="12" height="8" rx="1" fill="#c9a84c" opacity="0.6"/>
  <!-- Student 2 sitting -->
  <circle cx="350" cy="205" r="8" fill="#3a2008"/>
  <rect x="342" y="212" width="16" height="10" rx="2" fill="#3a2008"/>
  <!-- Wax tablet -->
  <rect x="355" y="208" width="12" height="9" rx="1" fill="#c9a84c" opacity="0.6"/>
  <!-- Tree left -->
  <ellipse cx="35" cy="170" rx="22" ry="30" fill="#2a5010"/>
  <rect x="31" y="195" width="8" height="20" fill="#5a3010"/>
  <!-- Tree right -->
  <ellipse cx="365" cy="165" rx="20" ry="28" fill="#2a5010"/>
  <rect x="361" y="188" width="8" height="22" fill="#5a3010"/>
  <!-- Step at base -->
  <rect x="75" y="210" width="250" height="7" rx="1" fill="#b09050"/>
  <!-- Label -->
  <text x="200" y="253" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c9a84c" font-weight="bold" letter-spacing="2">DIE SCHULE</text>
</svg>
