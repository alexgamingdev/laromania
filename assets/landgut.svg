<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="60%" stop-color="#4a7ab0"/>
      <stop offset="100%" stop-color="#6a9ad0"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6a20"/>
      <stop offset="100%" stop-color="#2a4010"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b070"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b3010"/>
      <stop offset="100%" stop-color="#5a1a05"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="320" cy="45" r="28" fill="#f8e060" opacity="0.9"/>
  <circle cx="320" cy="45" r="38" fill="#f8e060" opacity="0.12"/>
  <!-- Clouds -->
  <ellipse cx="100" cy="50" rx="45" ry="18" fill="white" opacity="0.5"/>
  <ellipse cx="80" cy="50" rx="30" ry="14" fill="white" opacity="0.4"/>
  <ellipse cx="240" cy="70" rx="35" ry="14" fill="white" opacity="0.4"/>
  <!-- Background hills -->
  <path d="M0,150 Q80,100 160,130 Q240,160 320,110 Q360,90 400,120 L400,260 L0,260 Z" fill="#3a5a18" opacity="0.5"/>
  <!-- Fields / vineyard rows -->
  <rect x="0" y="185" width="400" height="75" fill="url(#field)"/>
  <!-- Vineyard rows -->
  <g stroke="#5a8020" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="195" x2="140" y2="195"/>
    <line x1="0" y1="205" x2="140" y2="205"/>
    <line x1="0" y1="215" x2="140" y2="215"/>
    <line x1="0" y1="225" x2="140" y2="225"/>
    <line x1="260" y1="195" x2="400" y2="195"/>
    <line x1="260" y1="205" x2="400" y2="205"/>
    <line x1="260" y1="215" x2="400" y2="215"/>
    <line x1="260" y1="225" x2="400" y2="225"/>
  </g>
  <!-- Vine posts -->
  <g fill="#6b4020" opacity="0.7">
    <rect x="20" y="188" width="3" height="15"/>
    <rect x="45" y="188" width="3" height="15"/>
    <rect x="70" y="188" width="3" height="15"/>
    <rect x="95" y="188" width="3" height="15"/>
    <rect x="120" y="188" width="3" height="15"/>
    <rect x="270" y="188" width="3" height="15"/>
    <rect x="295" y="188" width="3" height="15"/>
    <rect x="320" y="188" width="3" height="15"/>
    <rect x="345" y="188" width="3" height="15"/>
    <rect x="370" y="188" width="3" height="15"/>
  </g>
  <!-- Path to villa -->
  <path d="M200,260 Q200,230 200,200 Q200,190 200,185" stroke="#c8a860" stroke-width="8" fill="none" opacity="0.5"/>
  <!-- Villa main building -->
  <!-- Wing left -->
  <rect x="80" y="135" width="60" height="55" rx="2" fill="url(#wall)"/>
  <polygon points="75,135 140,135 140,115 107,100" fill="url(#roof)"/>
  <!-- Wing right -->
  <rect x="260" y="135" width="60" height="55" rx="2" fill="url(#wall)"/>
  <polygon points="255,135 325,135 325,115 290,100" fill="url(#roof)"/>
  <!-- Main central building -->
  <rect x="120" y="105" width="160" height="85" rx="2" fill="#d8b878"/>
  <polygon points="115,105 285,105 285,75 200,50" fill="url(#roof)"/>
  <!-- Columns on main building -->
  <g fill="#e8d098">
    <rect x="130" y="105" width="8" height="55"/>
    <rect x="152" y="105" width="8" height="55"/>
    <rect x="174" y="105" width="8" height="55"/>
    <rect x="196" y="105" width="8" height="55"/>
    <rect x="218" y="105" width="8" height="55"/>
    <rect x="240" y="105" width="8" height="55"/>
    <rect x="262" y="105" width="8" height="55"/>
  </g>
  <!-- Capital tops -->
  <g fill="#c9a84c" opacity="0.7">
    <rect x="128" y="102" width="12" height="4"/>
    <rect x="150" y="102" width="12" height="4"/>
    <rect x="172" y="102" width="12" height="4"/>
    <rect x="194" y="102" width="12" height="4"/>
    <rect x="216" y="102" width="12" height="4"/>
    <rect x="238" y="102" width="12" height="4"/>
    <rect x="260" y="102" width="12" height="4"/>
  </g>
  <!-- Door -->
  <rect x="183" y="140" width="34" height="50" rx="2" fill="#5a2a08"/>
  <path d="M183,158 h34" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
  <!-- Windows -->
  <g fill="#8b5a20" opacity="0.7">
    <rect x="135" y="120" width="16" height="14" rx="1"/>
    <rect x="249" y="120" width="16" height="14" rx="1"/>
    <rect x="90" y="148" width="14" height="12" rx="1"/>
    <rect x="273" y="148" width="14" height="12" rx="1"/>
  </g>
  <!-- Cypress trees -->
  <g fill="#1a4a10">
    <ellipse cx="68" cy="148" rx="8" ry="28"/>
    <ellipse cx="332" cy="148" rx="8" ry="28"/>
    <ellipse cx="48" cy="155" rx="7" ry="22"/>
    <ellipse cx="352" cy="155" rx="7" ry="22"/>
  </g>
  <g fill="#3a2010">
    <rect x="65" y="170" width="6" height="18"/>
    <rect x="329" y="170" width="6" height="18"/>
    <rect x="45" y="172" width="5" height="15"/>
    <rect x="349" y="172" width="5" height="15"/>
  </g>
  <!-- Low perimeter wall -->
  <rect x="60" y="183" width="280" height="8" rx="1" fill="#b08840"/>
  <!-- Label -->
  <text x="200" y="253" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#c9a84c" font-weight="bold" letter-spacing="2">VILLA RUSTICA</text>
</svg>
